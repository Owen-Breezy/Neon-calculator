<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator PRO-X</title>
<style>
  :root {
    --text: #e0e0e0;
    --text-main: #f5f5f5;
    --accent: #00d4ff;
    --neon-purple: #b347ff;
    --primary: #00d4ff;
    --primary-dark: #7b2fff;
    --btn-num: rgba(255, 255, 255, 0.08);
    --btn-sci: rgba(179, 71, 255, 0.12);
  }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    display:flex; justify-content:center; align-items:center; 
    min-height:100vh; 
    background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2e 100%);
  }

  .site-logo {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .site-logo img {
    width: auto;
    height: 200px;
  }

  .calculator-glass { 
    width:360px; padding:25px; 
    background:rgba(20,20,35,0.6); backdrop-filter:blur(20px);
    border-radius:24px; border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 25px 50px rgba(0,0,0,0.5); 
  }
  .brand { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; color:var(--text); font-size:0.8rem; letter-spacing:2px; }
  .model-badge { background:rgba(255,255,255,0.1); padding:4px 10px; border-radius:6px; font-weight:600; }
  .history-display { min-height:25px; text-align:right; color:rgba(255,255,255,0.5); font-size:1rem; margin-bottom:5px; padding-right:10px; }
  .input-display { width:100%; padding:20px; font-size:2.2rem; font-weight:500; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:var(--text); margin-bottom:20px; border-radius:12px; text-align:right; min-height:78px; }
  .buttons-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .btn { border:none; height:48px; border-radius:10px; cursor:pointer; font-size:1rem; font-weight:500; color:var(--text-main); display:flex; justify-content:center; align-items:center; }
  .btn-num{ background:var(--btn-num); }
  .btn-sci{ background:var(--btn-sci); color:var(--neon-purple); font-size:0.9rem; }
  .btn-op{ background:rgba(0,212,255,0.15); color:var(--accent); }
  .btn-equal{ grid-column:span 5; background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color:white; font-size:1.2rem; font-weight:600; }
</style>
</head>
<body>

<a href="https://www.owenbreeezy.vercel.app" class="site-logo">
  <span><img src="Owen-breezy logo.png" alt="Owami Mzelemu's logo"></span>
</a>

<div class="calculator-glass">
  <div class="brand"><span>SCIENTIFIC</span><div class="model-badge">PRO-X</div></div>
  <div class="history-display" id="calc-history"></div>
  <div class="input-display" id="calc-display">0</div>
  <div class="buttons-grid">
    <button class="btn btn-sci" data-v="(">(</button>
    <button class="btn btn-sci" data-v=")">)</button>
    <button class="btn btn-sci" data-act="clear">AC</button>
    <button class="btn btn-sci" data-act="del">DEL</button>
    <button class="btn btn-sci" data-v="%">%</button>
    <button class="btn btn-sci" data-f="sin(">sin</button>
    <button class="btn btn-sci" data-f="cos(">cos</button>
    <button class="btn btn-sci" data-f="tan(">tan</button>
    <button class="btn btn-sci" data-f="log(">log</button>
    <button class="btn btn-sci" data-f="ln(">ln</button>
    <button class="btn btn-sci" data-f="sqrt(">√</button>
    <button class="btn btn-sci" data-v="^">x^y</button>
    <button class="btn btn-sci" data-v="π">π</button>
    <button class="btn btn-sci" data-v="e">e</button>
    <button class="btn btn-sci" data-v="*10^">EXP</button>
    <button class="btn btn-num" data-v="7">7</button>
    <button class="btn btn-num" data-v="8">8</button>
    <button class="btn btn-num" data-v="9">9</button>
    <button class="btn btn-op" data-v="*">×</button>
    <button class="btn btn-op" data-v="/">÷</button>
    <button class="btn btn-num" data-v="4">4</button>
    <button class="btn btn-num" data-v="5">5</button>
    <button class="btn btn-num" data-v="6">6</button>
    <button class="btn btn-op" data-v="+">+</button>
    <button class="btn btn-op" data-v="-">−</button>
    <button class="btn btn-num" data-v="1">1</button>
    <button class="btn btn-num" data-v="2">2</button>
    <button class="btn btn-num" data-v="3">3</button>
    <button class="btn btn-num" data-v="0">0</button>
    <button class="btn btn-num" data-v=".">.</button>
    <button class="btn btn-equal" data-act="eq">=</button>
  </div>
</div>

<script>
(() => {
  let currentInput='0', shouldReset=false;
  const display=document.getElementById('calc-display');
  const historyDisplay=document.getElementById('calc-history');
  const FUNC_MAP={ sin:'Math.sin(', cos:'Math.cos(', tan:'Math.tan(', log:'Math.log10(', ln:'Math.log(', sqrt:'Math.sqrt(' };
  const pretty=t=>t.replace(/\*/g,'×').replace(/\//g,'÷').replace(/sqrt\(/g,'√(');
  const update=()=>display.textContent=pretty(currentInput);
  function pushSymbol(s){
    const isOp=['+','-','*','/','^','%','*10^'].includes(s);
    if(shouldReset){ if(!isOp) currentInput='0'; shouldReset=false; }
    if(s==='.' && /\.\d*$/.test(currentInput.split(/[\+\-\*\/\^\(\)]/).pop())) return;
    if(isOp && s!=='%' && s!=='*10^' && /[+\-*/^]$/.test(currentInput)){
      if(!(s==='-' && /[*/^]$/.test(currentInput))) currentInput=currentInput.slice(0,-1);
    }
    if(currentInput==='0' && /^[πe(]$/.test(s)) currentInput='';
    currentInput+=s; update();
  }
  function pushFunction(f){ if(currentInput==='0'||shouldReset){currentInput=f;shouldReset=false;}else currentInput+=f; update(); }
  function calculate(){
    try{
      let expr=currentInput;
      let diff=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
      if(diff>0) expr+=')'.repeat(diff);
      historyDisplay.textContent=pretty(expr)+' =';
      expr=expr.replace(/\bπ\b/g,'(Math.PI)').replace(/\be\b/g,'(Math.E)').replace(/\b(sin|cos|tan|log|ln|sqrt)\(/g,(m,f)=>FUNC_MAP[f]).replace(/%/g,'/100').replace(/\^/g,'**');
      let result=Function('"use strict";return ('+expr+')')();
      result=parseFloat(result.toPrecision(12));
      currentInput=String(result); shouldReset=true; update();
    }catch(e){ display.textContent='Error'; currentInput='0'; shouldReset=true; }
  }
  function clearAll(){ currentInput='0'; historyDisplay.textContent=''; shouldReset=false; update(); }
  function backspace(){ const token=currentInput.match(/(sin\(|cos\(|tan\(|log\(|ln\(|sqrt\(|\*10\^)$/); currentInput=currentInput.slice(0,token?-token[0].length:-1); if(currentInput==='') currentInput='0'; update(); }
  document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>pushSymbol(b.dataset.v)));
  document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>pushFunction(b.dataset.f)));
  document.querySelector('[data-act="clear"]').addEventListener('click',clearAll);
  document.querySelector('[data-act="del"]').addEventListener('click',backspace);
  document.querySelector('[data-act="eq"]').addEventListener('click',calculate);
  update();
})();
</script>
</body>
</html>
